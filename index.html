<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPS Connect</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#173a47;font:16px system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:15px}header{background:#113e4e;color:white;padding:25px;border-radius:22px}h1{font-size:35px;margin:4px 0}h2{margin:0 0 14px}h3{margin:10px 0}nav,.actions,.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.row>*{flex:1}button{cursor:pointer;font:inherit;font-weight:750;border:0;border-radius:12px;padding:13px;background:#dcebf0;color:#163e4b}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#123e4e;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.blue{background:#2563eb;color:white}.orange{background:#ea580c;color:white}.yellow{background:#facc15;color:#413208}.purple{background:#7c3aed;color:white}.big{min-height:75px;flex:1;min-width:145px;font-size:18px}.panel{background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 3px 16px #143c4a13}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{background:white;border:2px solid #cbdfe6;border-radius:16px;padding:20px;text-align:left;min-height:130px}.tile:hover{border-color:#0891b2}.tile strong{display:block;font-size:22px;margin:9px 0}.muted{color:#637985}.field{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1;margin:8px 0}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;border:2px solid #d4e3e8;border-radius:10px;padding:12px;font:inherit}.stat{background:#eaf3f7;padding:15px;border-radius:13px;flex:1;min-width:115px}.stat strong{display:block;font-size:29px}.stat small{font-size:13px}.section{background:#f1f7f9;padding:15px;border-radius:14px;margin:14px 0}.choice{display:block;text-align:left;width:100%;min-height:90px;margin:10px 0;padding:18px;border:3px solid;border-radius:15px;font-size:17px}.choice b{font-size:21px}.choice small{display:block;margin-top:6px;font-size:16px;font-weight:500}.choice.selected{outline:4px solid #173e4b;outline-offset:1px}.lv0{background:#fee2e2;border-color:#ef4444;color:#991b1b}.lv1{background:#ffedd5;border-color:#f97316;color:#9a3412}.lv2{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}.lv3{background:#dcfce7;border-color:#22c55e;color:#166534}.score{background:#123e4e;color:white;padding:20px;border-radius:17px;margin:16px 0}.score strong{font-size:35px}.notice{background:#fff0d0;padding:13px;border-left:5px solid #f59e0b;border-radius:9px;margin:12px 0}.ok{background:#dcfce7;padding:13px;border-left:5px solid #16a34a;border-radius:9px;margin:12px 0}.bad{background:#fee2e2;padding:13px;border-left:5px solid #dc2626;border-radius:9px;margin:12px 0}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #d9e6ea}.ring{position:relative;max-width:410px;height:260px;border:6px solid #256079;border-radius:16px;background:#e7f3f6;margin:20px auto}.corner{position:absolute;border-radius:50%;width:60px;height:60px;transform:translate(-50%,-50%);background:white;border:3px solid #91bbc9;font-size:22px}.corner.done{background:#16a34a;color:white}.corner.now{background:#facc15}.ringcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900}.donut{width:175px;height:175px;border-radius:50%;display:grid;place-items:center;margin:15px auto}.donut span{background:white;width:115px;height:115px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900}.bar{height:13px;background:#dce9ed;border-radius:15px;overflow:hidden}.bar div{background:#22c55e;height:100%}footer{text-align:center;color:#617984;padding:22px;font-size:13px}@media(max-width:600px){.wrap{padding:9px}.panel{padding:14px}h1{font-size:28px}.choice{padding:13px}}
</style></head><body><div class="wrap" id="app"></div><script>
const sports=[['basket','🏀','Basketball',[['bobs','Observation individuelle'],['b31','Défi 3 contre 1'],['bshoot','Défi Shoot']]],['course','🏃','Course de durée',[['contract','Contrat d’allure'],['watch','Chronomètre d’observation']]],['boxe','🥊','Boxe française',[['touch','Observation des touches'],['tour','Le Tour de l’enceinte'],['arb','Défi Arbitrage']]],['esca','🧗','Escalade',[['voies','Défi Voies'],['tech','Observation technique'],['permis','Permis d’assurer']]]];let sport=null,tool=null,s={},running=false,elapsed=0,start=0,tick=null;const $=id=>document.getElementById(id),n=x=>Number(x)||0,pc=(a,b)=>b?Math.round(a/b*100):0,fmt=ms=>{let sec=Math.max(0,ms)/1000;return `${String(Math.floor(sec/60)).padStart(2,'0')}:${(sec%60).toFixed(1).padStart(4,'0')}`},escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const btn=(label,fn,cls='',disabled=false)=>`<button class="${cls}" onclick="${fn}" ${disabled?'disabled':''}>${label}</button>`,field=(label,k,placeholder='',type='text')=>`<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}" value="${escapeHTML(s[k])}" oninput="setField('${k}',this.value)"></div>`,select=(label,k,opts,def)=>`<div class="field"><label>${label}</label><select onchange="set('${k}',this.value)">${opts.map(x=>`<option value="${x}" ${(s[k]??def)==x?'selected':''}>${x}</option>`).join('')}</select></div>`,stats=items=>`<div class="row">${items.map(([label,v])=>`<div class="stat"><small>${label}</small><strong>${v}</strong></div>`).join('')}</div>`,table=(heads,rows)=>rows.length?`<div style="overflow-x:auto"><table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="muted">Aucune donnée enregistrée.</p>';
function save(){try{localStorage.setItem('epsconnect_'+tool,JSON.stringify(s))}catch(e){}}function setField(k,v){s[k]=v;save()}function set(k,v){s[k]=v;save();render()}function act(fn){fn();save();render()}function add(k,v){act(()=>{(s[k]??=[]).push(v)})}function undo(k){act(()=>{(s[k]??[]).pop()})}function reset(){if(confirm('Réinitialiser les données de cet outil ?')){s={};elapsed=0;stopTimer();save();render()}}function stopTimer(){if(running){elapsed+=performance.now()-start;running=false}s.elapsed=elapsed;clearInterval(tick);tick=null}function goSport(id){stopTimer();sport=id;tool=null;render()}function goTool(id){stopTimer();tool=id;try{s=JSON.parse(localStorage.getItem('epsconnect_'+id))||{}}catch(e){s={}}elapsed=n(s.elapsed);render()}function home(){stopTimer();sport=null;tool=null;render()}function copyReport(){let txt=$('content')?.innerText||'';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>alert('Bilan copié')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}function fallbackCopy(txt){let t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Bilan copié')}
function render(){let cat=sports.find(x=>x[0]===sport),name=cat?.[3].find(x=>x[0]===tool)?.[1];$('app').innerHTML=`<header><small>EPS CONNECT · PLATEFORME EPS</small><h1>${name||((cat?.[1]||'🎯')+' '+(cat?.[2]||'EPS Connect'))}</h1><div>${tool?cat[2]:cat?'Choisissez votre outil':'11 outils · 4 activités sportives'}</div></header><nav>${btn('⌂ Accueil','home()','primary')}${sports.map(x=>btn(x[1]+' '+x[2],`goSport('${x[0]}')`,sport===x[0]?'primary':'')).join('')}${btn('📋 Évaluations',"window.location.href='./evaluations.html'",'purple')}${btn('📊 Résultats élèves',"window.location.href='./resultats.html'",'purple')}</nav>${tool?`<div class="actions">${btn('← Retour aux outils',`goSport('${sport}')`)}${btn('↺ Nouvel élève','reset()')}${btn('⧉ Copier le bilan','copyReport()')}</div><main class="panel" id="content">${views[tool]()}</main>${epsIdentityBox()}`:cat?`<main class="panel"><h2>Les outils ${cat[2]}</h2><div class="grid">${cat[3].map(([id,title],i)=>`<button class="tile" onclick="goTool('${id}')"><small>OUTIL ${i+1}</small><strong>${title}</strong>Ouvrir →</button>`).join('')}</div></main>`:`<main class="panel"><h2>Choisissez une activité</h2><p class="muted">Outils interactifs et bilans, sans compte. Les bilans peuvent être envoyés à ton enseignant en fin d'activité.</p><div class="grid">${sports.map(x=>`<button class="tile" onclick="goSport('${x[0]}')"><span style="font-size:40px">${x[1]}</span><strong>${x[2]}</strong>${x[3].length} outils →</button>`).join('')}</div></main>`}<footer>EPS Connect · Données locales au navigateur · Usage pédagogique</footer>`;if(tool==='watch')clockDisplay()}
const actions=k=>`<div class="actions">${btn('↶ Annuler',`undo('${k}')`,'',!(s[k]||[]).length)}${btn('⧉ Copier le bilan','copyReport()')}</div>`;
const EPS_API='https://jipvubvkkmkblxqvzreg.supabase.co/rest/v1/eps_submissions';
const EPS_KEY='sb_publishable_Q0fPK8f-qN-zb7Af4s-aJw_Cj28cyxa';
const EPS_CLASSES=['6e1','6e2','5e1','5e2','4e1','4e2','3e1','3e2'];
let epsIdentity={last:'',first:'',cls:''};
function epsIdentityBox(){return '<section class="panel"><h3>Enregistrer mon résultat</h3><p class="muted">Renseigne ton identité puis termine ton activité. Ton enseignant pourra consulter ce bilan.</p><div class="row"><label>Nom <input id="epsLast" maxlength="80" value="'+escapeHTML(epsIdentity.last)+'" oninput="epsIdentity.last=this.value"></label><label>Prénom <input id="epsFirst" maxlength="80" value="'+escapeHTML(epsIdentity.first)+'" oninput="epsIdentity.first=this.value"></label><label>Classe <select id="epsClass" onchange="epsIdentity.cls=this.value"><option value="">Choisir</option>'+EPS_CLASSES.map(c=>'<option value="'+c+'" '+(epsIdentity.cls===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label></div><div class="actions"><button class="primary" id="epsSend" onclick="epsSubmit()">📤 Envoyer mon résultat à mon enseignant</button></div><p class="muted" id="epsStatus" role="status">Une connexion Internet est nécessaire pour envoyer le résultat.</p></section>'}
async function epsSubmit(){const last=epsIdentity.last.trim(),first=epsIdentity.first.trim(),cls=epsIdentity.cls,st=document.getElementById('epsStatus'),button=document.getElementById('epsSend');if(!last||!first||!EPS_CLASSES.includes(cls)){st.textContent='Complète ton nom, ton prénom et ta classe.';return}if(!tool||!sport){st.textContent='Ouvre un outil sportif.';return}const allowed=['bobs','b31','bshoot','contract','watch','touch','tour','arb','voies','tech','permis'];if(!allowed.includes(tool)){st.textContent='Outil non reconnu.';return}button.disabled=true;st.textContent='Envoi en cours…';try{const payload={student_last_name:last,student_first_name:first,class_name:cls,activity:sport,tool,results:JSON.parse(JSON.stringify(s))};const res=await fetch(EPS_API,{method:'POST',headers:{'apikey':EPS_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!res.ok)throw Error('HTTP '+res.status);st.textContent='✓ Résultat enregistré pour '+first+' '+last+'. Tu peux fermer cette page.'}catch(e){st.textContent='Enregistrement impossible. Vérifie Internet et réessaie. Aucune confirmation de réception.'}finally{button.disabled=false}}

const views={};
views.bobs=()=>{let a=s.events||[],pass=a.filter(x=>x==='p').length,basket=a.filter(x=>x==='b').length;return `<h2>Observation individuelle</h2>${field('Élève','student','Nom de l’élève')}<p>Une action à renseigner pour chaque possession.</p><div class="actions">${btn('✓ Passe réussie',`add('events','p')`,'big green')}${btn('🏀 Panier',`add('events','b')`,'big blue')}${btn('○ Autre possession',`add('events','o')`,'big orange')}</div>${stats([['Touches',a.length],['Passes',pass],['Paniers',basket],['Efficacité',pc(pass+basket,a.length)+' %']])}<div class="section"><h3>Résultat collectif</h3>${['Victoire','Nul','Défaite'].map(x=>btn(x,`set('match','${x}')`,s.match===x?'primary':'')).join(' ')}</div><div class="section"><h3>Compétences</h3><p>C1 : efficacité technique · C2 : préparer et planifier</p>${['c1','c2'].map(k=>`<p><b>${k.toUpperCase()}</b> ${['Rouge','Orange','Bleu','Vert'].map((c,i)=>btn(c,`set('${k}',${i})`,s[k]===i?'primary':'')).join(' ')}</p>`).join('')}</div>${actions('events')}`};
views.b31=()=>{let a=s.events||[],pts={g:3,b:2,o:1,r:0},total=a.reduce((sum,x)=>sum+pts[x],0);return `<h2>Défi 3 contre 1</h2><p>6 passages, 4 issues possibles.</p>${stats([['Passages',a.length+'/6'],['Score',total+'/18'],['Ratio',pc(total,18)+' %']])}<div class="actions">${[['g','Panier ≤ 2 passes · 3 pts','green'],['b','Tir raté ≤ 2 passes · 2 pts','blue'],['o','Tir après > 2 passes · 1 pt','orange'],['r','Interception · 0 pt','red']].map(([k,t,c])=>btn(t,`add('events','${k}')`,'big '+c,a.length>=6)).join('')}</div>${table(['Passage','Résultat','Points'],a.map((x,i)=>[i+1,{g:'Panier rapide',b:'Tir rapide raté',o:'Tir tardif',r:'Interception'}[x],pts[x]]))}${actions('events')}`};
views.bshoot=()=>{let a=s.events||[],count=k=>a.filter(x=>x===k).length,miss=count('m'),score=count('r')+count('y')*2+count('g')*3,rate=pc(a.length-miss,a.length),r=count('r')/9*100,y=(count('r')+count('y'))/9*100,g=(a.length-miss)/9*100,t=a.length/9*100;return `<h2>Défi Shoot · 9 tirs</h2><p>3 plots rouges à 1 pt, 3 jaunes à 2 pts, 3 verts à 3 pts.</p>${stats([['Tirs',a.length+'/9'],['Score',score+'/18'],['Réussite',rate+' %']])}<div class="donut" style="background:conic-gradient(#ef4444 0 ${r}%,#facc15 ${r}% ${y}%,#16a34a ${y}% ${g}%,#475569 ${g}% ${t}%,#e2e8f0 ${t}% 100%)"><span>${rate}%</span></div><p style="text-align:center">🔴 ${count('r')}/3 · 🟡 ${count('y')}/3 · 🟢 ${count('g')}/3 · Ratés ${miss}</p><div class="actions">${btn('🔴 Réussi · 1 pt',`add('events','r')`,'big red',a.length>=9||count('r')>=3)}${btn('🟡 Réussi · 2 pts',`add('events','y')`,'big yellow',a.length>=9||count('y')>=3)}${btn('🟢 Réussi · 3 pts',`add('events','g')`,'big green',a.length>=9||count('g')>=3)}${btn('✕ Raté',`add('events','m')`,'big',a.length>=9)}</div>${actions('events')}`};
const speeds=Array.from({length:23},(_,i)=>(6+i*.5).toFixed(1));views.contract=()=>{let v=n(s.speed||10),m=n(s.mins||6),dist=v*1000/60*m,split=360000/v;return `<h2>Contrat d’allure</h2><div class="row">${select('Vitesse cible (km/h)','speed',speeds,'10.0')}${select('Durée (minutes)','mins',['3','6','9'],'6')}</div>${stats([['Distance cible',Math.round(dist)+' m'],['100 m cible',fmt(split)],['Allure',v+' km/h']])}<h3>Repères de passage</h3>${table(['Distance','Temps attendu'],Array.from({length:Math.floor(dist/100)},(_,i)=>[(i+1)*100+' m',fmt((i+1)*split)]))}`};
function clockMs(){return elapsed+(running?performance.now()-start:0)}function clockDisplay(){if($('clock'))$('clock').textContent=fmt(clockMs())}function startClock(){if(running)return;start=performance.now();running=true;tick=setInterval(clockDisplay,100);render()}function pauseClock(){stopTimer();save();render()}function lap(){if(running)add('laps',clockMs())}views.watch=()=>{let laps=s.laps||[],ms=clockMs(),v=n(s.speed||10),avg=ms?laps.length*100/ms*3600:0,expected=360000/v;return `<h2>Chronomètre d’observation · 100 m</h2>${select('Vitesse cible (km/h)','speed',speeds,'10.0')}<div class="section" style="text-align:center"><div id="clock" style="font-size:clamp(50px,9vw,86px);font-weight:900;font-variant-numeric:tabular-nums">${fmt(ms)}</div><p>100 m attendu : ${fmt(expected)}</p></div><div class="actions">${btn('▶ Démarrer','startClock()','big green',running)}${btn('⏸ Arrêter','pauseClock()','big orange',!running)}${btn('＋ Passage +100 m','lap()','big blue',!running)}</div>${stats([['Distance',laps.length*100+' m'],['Passages',laps.length],['Vitesse moyenne',avg.toFixed(2)+' km/h'],['Écart vitesse',(avg-v).toFixed(2)+' km/h']])}<div class="row">${field('FC avant (bpm)','fcBefore','','number')}${field('FC arrivée (bpm)','fcEnd','','number')}${field('FC +1 min (bpm)','fcAfter','','number')}</div><h3>Historique des passages</h3>${table(['Distance','Chrono','Temps / 100 m','Écart cible'],laps.map((x,i)=>[(i+1)*100+' m',fmt(x),fmt(x-(laps[i-1]||0)),((x-(laps[i-1]||0)-expected)/1000).toFixed(1)+' s']))}${actions('laps')}<p class="muted">Chronomètre réel, mis en pause lorsque vous quittez cet outil.</p>`};
views.touch=()=>{let a=s.events||[],hit=a.filter(x=>x==='h').length,received=a.length-hit;return `<h2>Observation des touches</h2>${field('Tireur','student','Nom de l’élève')}<div class="actions">${btn('✓ TOUCHE VALIDÉE',`add('events','h')`,'big green')}${btn('✕ TOUCHE SUBIE',`add('events','s')`,'big red')}</div>${stats([['Touches validées',hit],['Touches subies',received],['Différence',hit-received]])}${actions('events')}`};
function tourData(){let a=s.events||[],tours=[],score=0;for(let x of a){if(tours.length===3)break;if(x==='h'){score++;if(score===4){tours.push(4);score=0}}else{tours.push(score);score=0}}return{tours,score,done:tours.length===3}}views.tour=()=>{let d=tourData(),total=d.tours.reduce((a,b)=>a+b,0)+d.score;return `<h2>Le Tour de l’enceinte</h2>${field('Tireur','student','Nom de l’élève')}<p>Trois tours : une touche réussie fait avancer d’un coin ; une touche subie termine le tour.</p>${stats([['Tour',d.done?'Terminé':d.tours.length+1+'/3'],['Coins du tour',d.score+'/4'],['Total',total+'/12']])}<div class="ring">${[[9,12],[91,12],[91,88],[9,88]].map(([x,y],i)=>`<button disabled class="corner ${i<d.score?'done':i===d.score&&!d.done?'now':''}" style="left:${x}%;top:${y}%">${i+1}</button>`).join('')}<div class="ringcenter">TIREUR</div></div><div class="actions">${btn('✓ TOUCHE RÉUSSIE',`add('events','h')`,'big green',d.done)}${btn('✕ TOUCHE SUBIE',`add('events','s')`,'big red',d.done)}</div>${stats([['Tours complets',d.tours.filter(x=>x===4).length],['Réussite',pc(total,12)+' %']])}${table(['Tour','Coins validés'],d.tours.map((x,i)=>[i+1,x+'/4']))}${actions('events')}`};
const arb=[['Commandements','« En garde », « Allez », « Stop » au bon moment.'],['Placement','Voit les deux tireurs sans gêner.'],['Sécurité','Intervient immédiatement pour protéger les tireurs.'],['Décisions','Arrête et relance au bon moment.'],['Autorité','Se fait entendre et respecter.']];function rate(i,v){act(()=>{(s.ratings??={})[i]=v})}views.arb=()=>{let r=s.ratings||{},count=Object.keys(r).length,score=Object.values(r).reduce((a,b)=>a+b,0),ok=count===5&&score>=8&&r[2]===2;return `<h2>Défi Arbitrage</h2>${field('Arbitre','student','Nom de l’élève')}${arb.map(([name,desc],i)=>`<div class="section" style="background:${['#dbeafe','#ede9fe','#ffedd5','#ccfbf1','#fef3c7'][i]}"><h3>${i+1}. ${name}</h3><p>${desc}</p><div class="actions">${[['Non acquis',0,'red'],['En cours',1,'orange'],['Acquis',2,'green']].map(([label,v,c])=>btn((r[i]===v?'✓ ':'')+label,`rate(${i},${v})`,'big '+c)).join('')}</div></div>`).join('')}<div class="score"><strong>${score}/10</strong><p>${count}/5 critères évalués</p><div class="bar"><div style="width:${score*10}%"></div></div></div><div class="${count<5?'notice':ok?'ok':'bad'}">${count<5?'Évaluation à compléter':ok?'ARBITRAGE VALIDÉ':r[2]!==2?'Sécurité à renforcer':'Arbitrage à améliorer'}</div>${field('Conseils','notes','Conseils pour progresser')}`};
const grades=['3','4a','4b','4c','5a','5b','5c','6a','6a+','6b','6b+','6c','7a'];function voie(ok){add('events',{ok,grade:s.grade||'4a',type:s.type||'Voie avec corde'})}views.voies=()=>{let a=s.events||[],success=a.filter(x=>x.ok),best=success.length?success.reduce((b,x)=>grades.indexOf(x.grade)>grades.indexOf(b.grade)?x:b).grade:'—';return `<h2>Défi Voies</h2>${field('Grimpeur','student','Nom de l’élève')}<div class="row">${select('Type','type',['Voie avec corde','Bloc'],'Voie avec corde')}${select('Cotation','grade',grades,'4a')}</div><div class="actions">${btn('✓ RÉUSSIE','voie(true)','big green')}${btn('✕ ÉCHOUÉE','voie(false)','big red')}</div>${stats([['Tentatives',a.length],['Réussites',success.length],['Taux',pc(success.length,a.length)+' %'],['Meilleure cotation',best]])}${table(['Essai','Type','Cotation','Résultat'],a.map((x,i)=>[i+1,x.type,x.grade,x.ok?'Réussie':'Échouée']))}${actions('events')}`};
const tech=[['Utilisation des pieds',[['Pieds peu utilisés','Se hisse surtout avec les bras. Les pieds glissent ou cherchent les prises.'],['Appuis hésitants','Replace plusieurs fois les pieds. Pousse peu sur les jambes.'],['Appuis efficaces','Regarde et pose précisément les pieds. Pousse sur les jambes.'],['Appuis optimisés','Utilise pointes et carres. Transfère son poids et économise ses bras.']]],['Équilibre et bassin',[['Équilibre subi','Bassin souvent éloigné, bras fléchis, pertes d’équilibre.'],['Équilibre instable','Replace parfois le bassin, mais compense avec les bras.'],['Équilibre construit','Oriente le bassin et transfère son poids sur la jambe porteuse.'],['Équilibre anticipé','Place le bassin avant le mouvement et utilise des positions de profil.']]],['Fluidité des déplacements',[['Déplacement discontinu','S’arrête presque à chaque prise. Gestes brusques et bras crispés.'],['Enchaînement irrégulier','Enchaîne quelques mouvements puis s’arrête ou se replace souvent.'],['Déplacement fluide','Enchaîne plusieurs mouvements et coordonne pieds, bassin et mains.'],['Déplacement économique','Mouvements précis et continus. Pauses choisies sur des positions de repos.']]],['Lecture de l’itinéraire',[['Lecture absente','Découvre les prises au dernier moment et se retrouve bloqué.'],['Lecture partielle','Repère la prise suivante, mais hésite sur les pieds.'],['Lecture organisée','Prévoit plusieurs prises et les appuis nécessaires.'],['Lecture anticipée','Identifie passages difficiles et repos ; prévoit ses enchaînements.']]]];views.tech=()=>{let r=s.ratings||{},idx=n(s.active),count=Object.keys(r).length,score=Object.values(r).reduce((a,b)=>a+b+1,0);return `<h2>Observation technique</h2>${field('Grimpeur','student','Nom de l’élève')}<div class="actions">${tech.map((x,i)=>btn((r[i]!==undefined?'✓ ':'')+(i+1),`set('active',${i})`,idx===i?'primary':'' )).join('')}</div><div class="section"><h3>Composante ${idx+1}/4 — ${tech[idx][0]}</h3><p>Sélectionne le comportement observé.</p></div>${tech[idx][1].map(([title,desc],i)=>`<button class="choice lv${i} ${r[idx]===i?'selected':''}" onclick="rate(${idx},${i})"><b>${i+1}. ${title}</b><small>${desc}</small>${r[idx]===i?'<small>✓ NIVEAU SÉLECTIONNÉ</small>':''}</button>`).join('')}<div class="actions">${btn('← Précédent',`set('active',${idx-1})`,'',idx===0)}${btn('Suivant →',`set('active',${idx+1})`,'primary',idx===3)}</div><div class="score"><strong>${score}/16</strong><p>${count}/4 composantes évaluées</p></div>${count===4?`<div class="ok">${score>=14?'Très bonne maîtrise':score>=10?'Maîtrise satisfaisante':score>=7?'Maîtrise fragile':'Maîtrise insuffisante'}</div>${table(['Composante','Niveau'],tech.map((x,i)=>[x[0],r[i]+1+'/4']))}`:'<div class="notice">Complète les quatre composantes.</div>'}${field('Conseil','notes','Conseil pour progresser')}`};
const permit=[['Vérifications du matériel','Baudriers, nœud, frein, mousqueton verrouillé et contrôles croisés.'],['Position correcte','Stable, proche du mur, décalé de l’axe du grimpeur.'],['Assurage en 5 temps','Gestuelle conforme au matériel ; main de freinage toujours sur la corde.'],['Contrôle de la corde','Reprise régulière, mou limité, freinage et descente maîtrisés.'],['Communication et vigilance','Regarde le grimpeur, communique et respecte le feu vert enseignant.']];function permitRate(i,v){act(()=>{(s.ratings??={})[i]=v;s.approved=false})}function permitApprove(v){s.approved=v;save();render()}views.permis=()=>{let r=s.ratings||{},count=Object.keys(r).length,valid=Object.values(r).filter(Boolean).length,all=valid===5;return `<h2>🛡️ Permis d’assurer</h2><p class="muted">Escalade en moulinette · 5 validations obligatoires</p><div class="row">${field('Élève','student','Nom et prénom')}${field('Classe','class','Ex. 4e1')}</div>${permit.map(([name,desc],i)=>`<div class="section" style="background:${['#dbeafe','#ede9fe','#d1fae5','#fef3c7','#fce7f3'][i]}"><h3>${i+1}. ${name}</h3><p style="font-size:17px">${desc}</p><div class="actions">${btn((r[i]===true?'✓ ':'')+'VALIDÉ',`permitRate(${i},true)`,'big green')}${btn((r[i]===false?'✓ ':'')+'À REVOIR',`permitRate(${i},false)`,'big red')}</div></div>`).join('')}<div class="score"><strong>${valid}/5</strong><p>Compétences validées · ${count}/5 renseignées</p></div><div class="${all?'ok':count===5?'bad':'notice'}">${all?'5 compétences validées. Confirmation de l’enseignant requise.':count===5?'Permis non acquis : compétences à retravailler.':'Évaluation en cours.'}</div>${all?`<div class="section"><h3>Validation par l’enseignant</h3>${field('Enseignant','teacher','Nom de l’enseignant')}${field('Date','date','','date')}<label><input type="checkbox" ${s.approved?'checked':''} onchange="permitApprove(this.checked)" ${!s.student?.trim()||!s.teacher?.trim()||!s.date?'disabled':''}> Je confirme avoir observé l’élève et validé les cinq compétences.</label></div>`:''}${all&&s.approved?`<div class="ok" style="text-align:center"><h2>🏅 PERMIS D’ASSURER OBTENU</h2><h3>${escapeHTML(s.student)}</h3><p>${escapeHTML(s.class)} · ${escapeHTML(s.date)} · ${escapeHTML(s.teacher)}</p><b>Permis pédagogique interne · pratique encadrée</b></div>`:''}<div class="notice">Ce permis ne dispense jamais des contrôles de sécurité ni de l’autorisation de l’enseignant avant chaque départ. Il s’applique au matériel et au protocole effectivement enseignés.</div>`};
render();

</script></body></html>
