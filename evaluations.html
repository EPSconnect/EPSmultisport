<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évaluations · EPS Connect</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#173a47;font:16px system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:18px}header{background:#113e4e;color:white;padding:25px;border-radius:20px}h1{margin:5px 0}a{color:#0b647b}header a{color:white}.panel{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 16px #143c4a13}button,select,input{font:inherit;border-radius:10px;padding:10px;border:1px solid #cadbe2}button{cursor:pointer;font-weight:700;background:#e3eef2;color:#163e4b}.primary{background:#113e4e;color:white}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#627b87}.notice{padding:13px;border-radius:12px;background:#fff0d0;border-left:4px solid #f59e0b}.tablewrap{overflow:auto}table{border-collapse:collapse;min-width:920px;width:100%}th,td{padding:12px;border-bottom:1px solid #dce8ec;text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:white;min-width:130px}th{background:#edf4f6;font-size:13px}th:first-child{background:#edf4f6}.dots{display:flex;gap:5px;justify-content:center}.dot{width:24px;height:24px;padding:0;border:2px solid transparent;border-radius:50%;opacity:.5}.dot.active{opacity:1;border-color:#173a47;outline:2px solid #d4e3e8}.dot[data-v="1"]{background:#ef4444}.dot[data-v="2"]{background:#f97316}.dot[data-v="3"]{background:#3b82f6}.dot[data-v="4"]{background:#22c55e}.pill{border-radius:9px;padding:6px 9px;font-weight:700;font-size:13px;white-space:nowrap}.v1{background:#fee2e2;color:#991b1b}.v2{background:#ffedd5;color:#9a3412}.v3{background:#dbeafe;color:#1d4ed8}.v4{background:#dcfce7;color:#166534}.empty{color:#8497a0}label{font-weight:700}footer{font-size:13px;color:#617984;text-align:center;padding:20px}@media(max-width:600px){.wrap{padding:9px}.panel{padding:14px}}
.bilan-dot{width:25px;height:25px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b4c9d2;display:inline-block;vertical-align:middle;padding:0;cursor:pointer}.bilan-dot[data-v="1"]{background:#ef4444}.bilan-dot[data-v="2"]{background:#f97316}.bilan-dot[data-v="3"]{background:#3b82f6}.bilan-dot[data-v="4"]{background:#22c55e}.bilan-dot[data-v="0"]{background:#fff;border:2px dashed #9aabb3}.bilan-dot:hover{outline:2px solid #173a47}</style></head><body><div class="wrap"><header><a href="./index.html">← Retour à EPS Connect</a><h1>Évaluations · Espace enseignant</h1><p>Grille collective de maîtrise des compétences et domaines du socle</p></header><main id="app"></main><footer>EPS Connect · Évaluations enseignant · Démonstration locale</footer></div><script>
const competencies={
D1:{title:'Développer sa motricité et construire un langage du corps',elements:['Adapter sa motricité à des situations variées.','Acquérir des techniques spécifiques pour améliorer son efficacité.','Mobiliser différentes ressources (physiologique, biomécanique, psychologique, émotionnelle) pour agir de manière efficiente.']},
D2:{title:'S’approprier seul ou à plusieurs par la pratique, les méthodes et outils pour apprendre',elements:['Appliquer des consignes et des méthodes','Apprendre par l’action, l’observation, l’analyse de son activité et de celle des autres.','Répéter un geste pour le stabiliser et le rendre plus efficace.','Utiliser des outils numériques pour observer, évaluer et modifier ses actions.']},
D3:{title:'Partager des règles, assumer des rôles et des responsabilités',elements:['Assumer les rôles sociaux spécifiques aux différentes APSA et à la classe (joueur, coach, arbitre, juge, observateur, tuteur, médiateur, organisateur...).','Comprendre, respecter et faire respecter règles et règlements.','Assurer sa sécurité et celle d’autrui dans des situations variées.','S’engager dans les activités sportives et artistiques collectives.']},
D4:{title:'Apprendre à entretenir sa santé par une activité physique régulière',elements:['Évaluer la quantité et la qualité de son activité physique quotidienne dans et hors l’école.','Connaître et appliquer des principes d’une bonne hygiène de vie.','Adapter l’intensité de son engagement physique à ses possibilités pour ne pas se mettre en danger.']}
};
const activities={
basket:{name:'Basketball',ind:[['Conserver et faire progresser le ballon','D1',1],['Se démarquer et proposer une solution','D1',0],['Choisir une action adaptée (passe, dribble, tir)','D1',1],['Se replacer en attaque et en défense','D1',0],['Tenir un rôle (observateur / arbitre)','D3',0]],selected:[['D1',1],['D1',0],['D3',0]]},
course:{name:'Course de durée',ind:[['Régularité de l’allure','D1',0],['Observer et ajuster son allure','D2',1],['Adapter son effort à ses possibilités','D4',2]],selected:[['D1',0],['D2',1],['D4',2]]}
};const labels=['','Maîtrise insuffisante','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise'];let unlocked=false,activity='basket',count=12,data={},overrides={},rosters={},currentClass='6e1',classEvaluations={};const $=x=>document.getElementById(x);
function escapeName(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function level(v){return v?'<span class="pill v'+v+'">'+labels[v]+'</span>':'<span class="empty">Non évalué</span>'}
function average(vals){if(!vals.length)return 0;return Math.max(1,Math.min(4,Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)))}
function competence(i,d,j){const k=activity+'|'+i+'|'+d+'|'+j;if(overrides[k])return overrides[k];const values=activities[activity].ind.map((ind,n)=>ind[1]===d&&ind[2]===j?(data[activity+'|'+i+'|'+n]||0):0).filter(Boolean);return average(values)}
function domain(i,d){const k=activity+'|'+i+'|'+d,override=overrides[k];if(override)return override;const values=activities[activity].ind.map((ind,j)=>ind[1]===d?(data[activity+'|'+i+'|'+j]||0):0).filter(Boolean);return average(values)}
function dot(i,j,v){const k=activity+'|'+i+'|'+j;data[k]=data[k]===v?0:v;render()}
function cycleCompetence(i,d,j){const k=activity+'|'+i+'|'+d+'|'+j;const current=overrides[k]||competence(i,d,j)||0;overrides[k]=current>=4?0:current+1;render()}
function setCompetenceOverride(i,d,j,v){overrides[activity+'|'+i+'|'+d+'|'+j]=Number(v);render()}
function setOverride(i,d,v){const k=activity+'|'+i+'|'+d;overrides[k]=Number(v);render()}
function saveCurrentClass(){classEvaluations[currentClass]={data:{...data},overrides:{...overrides}}}
function switchToClass(cls){if(cls!==currentClass){saveCurrentClass();currentClass=cls;const saved=classEvaluations[cls]||{};data={...(saved.data||{})};overrides={...(saved.overrides||{})}}count=(rosters[cls]||[]).length||12;render()}
function loadRosters(files){const chosen=Array.from(files||[]);if(!chosen.length)return;let done=0,loaded=[],errors=[];chosen.forEach(file=>{const match=file.name.match(/(6e1|6e2|5e1|5e2|4e1|4e2|3e1|3e2)/i);if(!match){errors.push(file.name);done++;if(done===chosen.length)finish();return}const cls=match[1].toLowerCase();const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const parsed=lines.map(x=>x.split(/[;\t,]/).map(z=>z.trim())).filter(x=>x.length>=2&&!/^nom$/i.test(x[0])).map(x=>x[0]+' '+x[1]);if(parsed.length){rosters[cls]=parsed.slice(0,45);loaded.push(cls)}else errors.push(file.name);done++;if(done===chosen.length)finish()};reader.onerror=()=>{errors.push(file.name);done++;if(done===chosen.length)finish()};reader.readAsText(file,'UTF-8')});function finish(){if(loaded.length){const target=loaded.length===1?loaded[0]:(loaded.includes(currentClass)?currentClass:loaded[0]);switchToClass(target)}else render();const status=document.getElementById('importStatus');if(status)status.textContent=loaded.length?'Classes chargées : '+loaded.join(', ')+'. Classe affichée : '+currentClass+'.'+(errors.length?' Fichiers non reconnus : '+errors.join(', '):''):'Aucune liste importée. Vérifie le nom du fichier (ex. 5e2.csv) et son contenu.'}}
function changeClass(v){switchToClass(v)}
async function checkAccess(){const input=document.getElementById('accessCode');const error=document.getElementById('accessError');if(!input)return;const bytes=new TextEncoder().encode(input.value);const hash=await crypto.subtle.digest('SHA-256',bytes);const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex==='3b042f254557b77e37878294edcdd92a4717494cae9ea1d3a082169694c206f8'){unlocked=true;render()}else{error.textContent='Code incorrect.';input.value='';input.focus()}}
function render(){if(!unlocked){$('app').innerHTML='<section class="panel" style="max-width:580px;margin:28px auto"><h2>Accès enseignant</h2><p>Saisissez votre code pour afficher la grille d’évaluation.</p><form onsubmit="event.preventDefault();checkAccess()"><label for="accessCode">Code d’accès</label><div class="row"><input id="accessCode" type="password" autocomplete="off" required placeholder="Code enseignant" style="flex:1"><button class="primary" type="submit">Accéder</button></div><p id="accessError" role="alert" class="muted"></p></form><div class="notice"><b>Protection limitée :</b> ce verrou d’interface n’est pas une authentification sécurisée. Le site GitHub Pages reste public. Ne conservez pas de données nominatives ou d’évaluations sensibles sur un appareil partagé.</div></section>';return}
const ind=activities[activity].ind,selected=activities[activity].selected;let html='<section class="panel"><div class="row"><label for="classSelect">Classe</label><select id="classSelect" onchange="changeClass(this.value)">'+['6e1','6e2','5e1','5e2','4e1','4e2','3e1','3e2'].map(c=>'<option '+(currentClass===c?'selected':'')+'>'+c+'</option>').join('')+'</select><label for="roster">Importer les listes des classes (CSV)</label><input id="roster" type="file" multiple accept=".csv,.txt,text/plain" onchange="loadRosters(this.files)"><label for="activity">Activité</label><select id="activity" onchange="activity=this.value;render()"><option value="basket" '+(activity==='basket'?'selected':'')+'>Basketball</option><option value="course" '+(activity==='course'?'selected':'')+'>Course de durée</option></select><label for="count">Nombre de lignes</label><input id="count" type="number" min="1" max="40" value="'+count+'" style="width:85px" onchange="count=Math.min(40,Math.max(1,Number(this.value)||1));render()"><button onclick="window.print()">Imprimer / PDF</button><button onclick="if(confirm(\'Effacer toutes les évaluations de démonstration ?\')){data={};overrides={};render()}">Réinitialiser</button><button onclick="unlocked=false;render()">Fermer l’espace</button></div><p id="importStatus" class="muted" role="status">Importe un ou plusieurs CSV ; la classe importée s’affichera automatiquement.</p><p class="muted">Cliquez sur un point de couleur pour attribuer un niveau. Cliquez à nouveau pour retirer l’évaluation. Les habiletés sont volontairement limitées pour une évaluation rapide.</p><div class="notice">Les fichiers CSV sont lus uniquement dans ce navigateur et n’est pas envoyée sur GitHub. Ne l’importez que sur un appareil professionnel sécurisé : cette démonstration ne protège pas l’accès aux noms affichés. Aucun enregistrement persistant ni authentification sécurisée n’est activé.</div></section>';
html+='<section class="panel tablewrap"><h2>Habiletés à évaluer</h2><table><thead><tr><th>Élève</th>'+ind.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr></thead><tbody>';
for(let i=0;i<count;i++){html+='<tr><td><b>'+escapeName((rosters[currentClass]||[])[i]||('Élève '+String(i+1).padStart(2,'0')))+'</b></td>';for(let j=0;j<ind.length;j++){const current=data[activity+'|'+i+'|'+j]||0;html+='<td><div class="dots">'+[1,2,3,4].map(v=>'<button class="dot '+(current===v?'active':'')+'" data-v="'+v+'" title="'+labels[v]+'" aria-label="'+labels[v]+'" aria-pressed="'+(current===v)+'" onclick="dot('+i+','+j+','+v+')"></button>').join('')+'</div></td>'}html+='</tr>'}
html+='</tbody></table></section><section class="panel tablewrap"><h2>Bilans · Compétences ÉcoleDirecte</h2><p class="muted">Basketball : 2 compétences D1 + 1 compétence D3. Une pastille indique le niveau ; cliquez dessus pour le modifier (rouge, orange, bleu, vert, puis calcul automatique).</p><table><thead><tr><th>Élève</th>'+selected.map(([d,j],n)=>'<th><strong>Compétence '+(n+1)+' — '+d+'</strong><div>'+competencies[d].elements[j]+'</div></th>').join('')+'</tr></thead><tbody>';
for(let i=0;i<count;i++){html+='<tr><td><b>'+escapeName((rosters[currentClass]||[])[i]||('Élève '+String(i+1).padStart(2,'0')))+'</b></td>';for(const [d,j] of selected){const val=competence(i,d,j);html+='<td><button class="bilan-dot" data-v="'+val+'" title="'+(labels[val]||'Non évalué')+' — cliquer pour modifier" aria-label="'+d+' : '+(labels[val]||'Non évalué')+'" onclick="cycleCompetence('+i+',\''+d+'\','+j+')"></button></td>'}html+='</tr>'}
html+='</tbody></table></section><section class="panel"><p>Rouge = 1, orange = 2, bleu = 3, vert = 4. Les habiletés non évaluées sont exclues du calcul. Le résultat reste modifiable par l’enseignant.</p></section>';$('app').innerHTML=html}render();
</script></body></html>
