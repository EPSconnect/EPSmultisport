<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évaluations · EPS Connect</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#173a47;font:16px system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:18px}header{background:#113e4e;color:white;padding:25px;border-radius:20px}h1{margin:5px 0}a{color:#0b647b}header a{color:white}.panel{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 16px #143c4a13}button,select,input{font:inherit;border-radius:10px;padding:10px;border:1px solid #cadbe2}button{cursor:pointer;font-weight:700;background:#e3eef2;color:#163e4b}.primary{background:#113e4e;color:white}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#627b87}.notice{padding:13px;border-radius:12px;background:#fff0d0;border-left:4px solid #f59e0b}.tablewrap{overflow:auto}table{border-collapse:collapse;min-width:920px;width:100%}th,td{padding:12px;border-bottom:1px solid #dce8ec;text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:white;min-width:130px}th{background:#edf4f6;font-size:13px}th:first-child{background:#edf4f6}.dots{display:flex;gap:5px;justify-content:center}.dot{width:24px;height:24px;padding:0;border:2px solid transparent;border-radius:50%;opacity:.5}.dot.active{opacity:1;border-color:#173a47;outline:2px solid #d4e3e8}.dot[data-v="1"]{background:#ef4444}.dot[data-v="2"]{background:#f97316}.dot[data-v="3"]{background:#3b82f6}.dot[data-v="4"]{background:#22c55e}.pill{border-radius:9px;padding:6px 9px;font-weight:700;font-size:13px;white-space:nowrap}.v1{background:#fee2e2;color:#991b1b}.v2{background:#ffedd5;color:#9a3412}.v3{background:#dbeafe;color:#1d4ed8}.v4{background:#dcfce7;color:#166534}.empty{color:#8497a0}label{font-weight:700}footer{font-size:13px;color:#617984;text-align:center;padding:20px}@media(max-width:600px){.wrap{padding:9px}.panel{padding:14px}}
</style></head><body><div class="wrap"><header><a href="./index.html">← Retour à EPS Connect</a><h1>Évaluations · Espace enseignant</h1><p>Grille collective de maîtrise des compétences et domaines du socle</p></header><main id="app"></main><footer>EPS Connect · Prototype pédagogique sans données nominatives</footer></div><script>
const competencies={
D1:{title:'Développer sa motricité et construire un langage du corps',elements:['Adapter sa motricité à des situations variées.','Acquérir des techniques spécifiques pour améliorer son efficacité.','Mobiliser différentes ressources (physiologique, biomécanique, psychologique, émotionnelle) pour agir de manière efficiente.']},
D2:{title:'S’approprier seul ou à plusieurs par la pratique, les méthodes et outils pour apprendre',elements:['Appliquer des consignes et des méthodes','Apprendre par l’action, l’observation, l’analyse de son activité et de celle des autres.','Répéter un geste pour le stabiliser et le rendre plus efficace.','Utiliser des outils numériques pour observer, évaluer et modifier ses actions.']},
D3:{title:'Partager des règles, assumer des rôles et des responsabilités',elements:['Assumer les rôles sociaux spécifiques aux différentes APSA et à la classe (joueur, coach, arbitre, juge, observateur, tuteur, médiateur, organisateur...).','Comprendre, respecter et faire respecter règles et règlements.','Assurer sa sécurité et celle d’autrui dans des situations variées.','S’engager dans les activités sportives et artistiques collectives.']},
D4:{title:'Apprendre à entretenir sa santé par une activité physique régulière',elements:['Évaluer la quantité et la qualité de son activité physique quotidienne dans et hors l’école.','Connaître et appliquer des principes d’une bonne hygiène de vie.','Adapter l’intensité de son engagement physique à ses possibilités pour ne pas se mettre en danger.']}
};
const activities={
basket:{name:'Basketball',ind:[['Maîtrise du ballon','D1',1],['Passes et démarquage','D1',1],['Observer et analyser le jeu','D2',1],['Tenir un rôle d’observateur ou d’arbitre','D3',0]],selected:[['D1',1],['D2',1],['D3',0]]},
course:{name:'Course de durée',ind:[['Régularité de l’allure','D1',0],['Observer et ajuster son allure','D2',1],['Adapter son effort à ses possibilités','D4',2]],selected:[['D1',0],['D2',1],['D4',2]]}
};const labels=['','Maîtrise insuffisante','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise'];let unlocked=false,activity='basket',count=12,data={},overrides={},rosters={},currentClass='6e1';const $=x=>document.getElementById(x);
function escapeName(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function level(v){return v?'<span class="pill v'+v+'">'+labels[v]+'</span>':'<span class="empty">Non évalué</span>'}
function average(vals){if(!vals.length)return 0;return Math.max(1,Math.min(4,Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)))}
function competence(i,d,j){const k=activity+'|'+i+'|'+d+'|'+j;if(overrides[k])return overrides[k];const values=activities[activity].ind.map((ind,n)=>ind[1]===d&&ind[2]===j?(data[activity+'|'+i+'|'+n]||0):0).filter(Boolean);return average(values)}
function domain(i,d){const k=activity+'|'+i+'|'+d,override=overrides[k];if(override)return override;const values=activities[activity].ind.map((ind,j)=>ind[1]===d?(data[activity+'|'+i+'|'+j]||0):0).filter(Boolean);return average(values)}
function dot(i,j,v){const k=activity+'|'+i+'|'+j;data[k]=data[k]===v?0:v;render()}
function setCompetenceOverride(i,d,j,v){overrides[activity+'|'+i+'|'+d+'|'+j]=Number(v);render()}
function setOverride(i,d,v){const k=activity+'|'+i+'|'+d;overrides[k]=Number(v);render()}
function loadRosters(files){const chosen=Array.from(files||[]);if(!chosen.length)return;let done=0,loaded=0;chosen.forEach(file=>{const match=file.name.match(/(6e1|6e2|5e1|5e2|4e1|4e2|3e1|3e2)/i);if(!match){done++;if(done===chosen.length)finish();return}const cls=match[1].toLowerCase();const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const parsed=lines.map(x=>x.split(/[;\t]/).map(z=>z.trim())).filter(x=>x.length>=2).map(x=>x[0]+' '+x[1]).filter(x=>!/^nom\s*;?\s*prénom$/i.test(x));if(parsed.length){rosters[cls]=parsed.slice(0,45);loaded++}done++;if(done===chosen.length)finish()};reader.onerror=()=>{done++;if(done===chosen.length)finish()};reader.readAsText(file,'UTF-8')});function finish(){count=(rosters[currentClass]||[]).length||12;data={};overrides={};render();alert(loaded+' liste(s) chargée(s) pour cette session. Les noms ne sont pas publiés sur GitHub.')}}
function changeClass(v){currentClass=v;count=(rosters[v]||[]).length||12;data={};overrides={};render()}
function render(){if(!unlocked){$('app').innerHTML='<section class="panel"><h2>Accès enseignant</h2><p>Cette version est une <b>démonstration</b>. Aucun mot de passe placé dans un site GitHub Pages public ne protège réellement des données.</p><div class="notice"><b>Ne saisissez aucun nom, prénom ou donnée personnelle d’élève.</b> Les évaluations sont anonymisées et conservées uniquement en mémoire jusqu’à la fermeture ou au rechargement de cette page.</div><p><button class="primary" onclick="unlocked=true;render()">Ouvrir la démonstration enseignant</button></p></section>';return}
const ind=activities[activity].ind,selected=activities[activity].selected;let html='<section class="panel"><div class="row"><label for="classSelect">Classe</label><select id="classSelect" onchange="changeClass(this.value)">'+['6e1','6e2','5e1','5e2','4e1','4e2','3e1','3e2'].map(c=>'<option '+(currentClass===c?'selected':'')+'>'+c+'</option>').join('')+'</select><label for="roster">Importer les listes des classes (CSV)</label><input id="roster" type="file" multiple accept=".csv,.txt,text/plain" onchange="loadRosters(this.files)"><label for="activity">Activité</label><select id="activity" onchange="activity=this.value;render()"><option value="basket" '+(activity==='basket'?'selected':'')+'>Basketball</option><option value="course" '+(activity==='course'?'selected':'')+'>Course de durée</option></select><label for="count">Nombre de lignes</label><input id="count" type="number" min="1" max="40" value="'+count+'" style="width:85px" onchange="count=Math.min(40,Math.max(1,Number(this.value)||1));render()"><button onclick="window.print()">Imprimer / PDF</button><button onclick="if(confirm(\'Effacer toutes les évaluations de démonstration ?\')){data={};overrides={};render()}">Réinitialiser</button><button onclick="unlocked=false;render()">Fermer l’espace</button></div><p class="muted">Cliquez sur un point de couleur pour attribuer un niveau. Cliquez à nouveau pour retirer l’évaluation. Les habiletés sont volontairement limitées pour une évaluation rapide.</p><div class="notice">Les fichiers CSV sont lus uniquement dans ce navigateur et n’est pas envoyée sur GitHub. Ne l’importez que sur un appareil professionnel sécurisé : cette démonstration ne protège pas l’accès aux noms affichés. Aucun enregistrement persistant ni authentification sécurisée n’est activé.</div></section>';
html+='<section class="panel tablewrap"><h2>Habiletés à évaluer</h2><table><thead><tr><th>Élève</th>'+ind.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr></thead><tbody>';
for(let i=0;i<count;i++){html+='<tr><td><b>'+escapeName((rosters[currentClass]||[])[i]||('Élève '+String(i+1).padStart(2,'0')))+'</b></td>';for(let j=0;j<ind.length;j++){const current=data[activity+'|'+i+'|'+j]||0;html+='<td><div class="dots">'+[1,2,3,4].map(v=>'<button class="dot '+(current===v?'active':'')+'" data-v="'+v+'" title="'+labels[v]+'" aria-label="'+labels[v]+'" aria-pressed="'+(current===v)+'" onclick="dot('+i+','+j+','+v+')"></button>').join('')+'</div></td>'}html+='</tr>'}
html+='</tbody></table></section><section class="panel tablewrap"><h2>Bilans · Compétences ÉcoleDirecte</h2><p class="muted">Trois compétences maximum par activité, proposées à partir des habiletés. Ajustement manuel possible.</p><table><thead><tr><th>Élève</th>'+selected.map(([d,j])=>'<th>'+d+' · '+competencies[d].elements[j]+'</th>').join('')+'</tr></thead><tbody>';
for(let i=0;i<count;i++){html+='<tr><td><b>'+escapeName((rosters[currentClass]||[])[i]||('Élève '+String(i+1).padStart(2,'0')))+'</b></td>';for(const [d,j] of selected){const val=competence(i,d,j);html+='<td>'+level(val)+'<div><select aria-label="Évaluer '+d+'" onchange="setCompetenceOverride('+i+',\''+d+'\','+j+',this.value)"><option value="0">Calcul auto</option>'+[1,2,3,4].map(v=>'<option value="'+v+'" '+(overrides[activity+'|'+i+'|'+d+'|'+j]===v?'selected':'')+'>'+labels[v]+'</option>').join('')+'</select></div></td>'}html+='</tr>'}
html+='</tbody></table></section><section class="panel"><p>Rouge = 1, orange = 2, bleu = 3, vert = 4. Les habiletés non évaluées sont exclues du calcul. Le résultat reste modifiable par l’enseignant.</p></section>';$('app').innerHTML=html}render();
</script></body></html>
