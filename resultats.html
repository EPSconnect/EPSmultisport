<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPS Connect · Résultats élèves</title><link rel="apple-touch-icon" href="./eps-connect-ipad.png"><style>body{margin:0;background:#eef5f7;color:#183d49;font:16px system-ui,Arial}.wrap{max-width:1150px;margin:auto;padding:20px}header,.panel{background:white;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 2px 12px #1233}header{background:#123e4e;color:white}a{color:#0a8290}header a{color:white}input,select,button{font:inherit;padding:12px;border:1px solid #abc4cd;border-radius:9px;margin:5px}button{background:#166579;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:inline-block;margin:5px}table{border-collapse:collapse;width:100%;min-width:650px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}th{background:#e8f2f4}.scroll{overflow:auto}.muted{color:#57717a}.danger{color:#a32525}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f6;padding:12px;border-radius:9px}details{max-width:460px}</style></head><body><div class="wrap"><header><a href="./index.html">← EPS Connect</a><h1>📊 Résultats des élèves</h1><p>Accès réservé aux enseignants autorisés</p></header><main id="app"><section class="panel">Chargement…</section></main></div><script>
const API='https://jipvubvkkmkblxqvzreg.supabase.co',KEY='sb_publishable_Q0fPK8f-qN-zb7Af4s-aJw_Cj28cyxa',TEACHER='leosimonusm82@gmail.com';let access=null,items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hdr=()=>({'apikey':KEY,'Content-Type':'application/json',...(access?{'Authorization':'Bearer '+access}:{})});function loginView(msg=''){ $('app').innerHTML='<section class="panel"><h2>Connexion enseignant</h2><p>Utilise ton adresse autorisée et un mot de passe personnel (au moins 12 caractères). Ce mot de passe est différent du code local des évaluations.</p><form onsubmit="event.preventDefault();login()"><label>E-mail <input id="email" type="email" required autocomplete="username" value="'+TEACHER+'"></label><label>Mot de passe <input id="pass" type="password" required minlength="12" autocomplete="current-password"></label><div><button type="submit">Se connecter</button><button type="button" onclick="signup()">Créer mon accès enseignant</button></div></form><p id="message" role="status">'+esc(msg)+'</p><p class="muted">Lors de la première inscription, vérifie le message de confirmation envoyé par Supabase à ton adresse e-mail. Ne communique pas ton mot de passe aux élèves.</p></section>'}
async function signup(){const email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(email!==TEACHER){$('message').textContent='Adresse enseignant non autorisée.';return}if(password.length<12){$('message').textContent='Choisis au moins 12 caractères.';return}try{const r=await fetch(API+'/auth/v1/signup?redirect_to='+encodeURIComponent('https://epsconnect.github.io/EPSmultisport/resultats.html'),{method:'POST',headers:hdr(),body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Inscription impossible');$('message').textContent='Inscription demandée. Vérifie ton e-mail pour confirmer ton compte, puis reviens te connecter.'}catch(e){$('message').textContent=e.message}}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(email!==TEACHER){$('message').textContent='Adresse enseignant non autorisée.';return}try{const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:hdr(),body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error_description||j.msg||j.message||'Connexion impossible');access=j.access_token;await load()}catch(e){$('message').textContent=e.message}}
async function load(){try{const r=await fetch(API+'/rest/v1/eps_submissions?select=*&order=created_at.desc&limit=1000',{headers:hdr()});if(!r.ok)throw Error('Accès refusé ou session expirée ('+r.status+')');items=await r.json();show()}catch(e){$('app').innerHTML='<section class="panel"><p class="danger">'+esc(e.message)+'</p><button onclick="logout()">Se reconnecter</button></section>'}}
function logout(){access=null;items=[];loginView('Déconnecté.')}
function show(){ $('app').innerHTML='<section class="panel"><h2>Bilans reçus</h2><p class="muted">'+items.length+' résultat(s) affiché(s), 1 000 derniers maximum.</p><label>Classe <select id="filter" onchange="draw()"><option value="">Toutes</option>'+['6e1','6e2','5e1','5e2','4e1','4e2','3e1','3e2'].map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Rechercher <input id="search" placeholder="Nom, prénom, activité" oninput="draw()"></label><button onclick="load()">Actualiser</button><button onclick="exportCSV()">Exporter CSV</button><button onclick="logout()">Se déconnecter</button><div class="scroll" id="results"></div></section>';draw()}
function filtered(){const cls=$('filter')?.value||'',q=($('search')?.value||'').toLowerCase();return items.filter(x=>(!cls||x.class_name===cls)&&(!q||[x.student_last_name,x.student_first_name,x.activity,x.tool].join(' ').toLowerCase().includes(q)))}
function draw(){const a=filtered();$('results').innerHTML=a.length?'<table><thead><tr><th>Date</th><th>Classe</th><th>Élève</th><th>Activité</th><th>Outil</th><th>Bilan</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('fr-FR'))+'</td><td>'+esc(x.class_name)+'</td><td>'+esc(x.student_last_name)+' '+esc(x.student_first_name)+'</td><td>'+esc(({basket:'Basketball',course:'Course de durée',boxe:'Boxe',esca:'Escalade'})[x.activity]||x.activity)+'</td><td>'+esc(x.tool)+'</td><td><details><summary>Voir les données</summary><pre>'+esc(JSON.stringify(x.results,null,2))+'</pre></details></td></tr>').join('')+'</tbody></table>':'<p>Aucun résultat pour cette sélection.</p>'}
function exportCSV(){const fields=['created_at','class_name','student_last_name','student_first_name','activity','tool','results'],rows=[fields,...filtered().map(x=>fields.map(f=>f==='results'?JSON.stringify(x.results):x[f]))];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='eps-connect-resultats.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
loginView();
</script></body></html>
