<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPS Connect · Résultats élèves</title><link rel="apple-touch-icon" href="./eps-connect-ipad.png"><style>body{margin:0;background:#eef5f7;color:#183d49;font:16px system-ui,Arial}.wrap{max-width:1150px;margin:auto;padding:20px}header,.panel{background:white;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 2px 12px #1233}header{background:#123e4e;color:white}a{color:#0a8290}header a{color:white}input,select,button{font:inherit;padding:12px;border:1px solid #abc4cd;border-radius:9px;margin:5px}button{background:#166579;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:inline-block;margin:5px}table{border-collapse:collapse;width:100%;min-width:650px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}th{background:#e8f2f4}.scroll{overflow:auto}.muted{color:#57717a}.danger{color:#a32525}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f6;padding:12px;border-radius:9px}details{max-width:460px}</style></head><body><div class="wrap"><header><a href="./index.html">← EPS Connect</a><h1>📊 Résultats des élèves</h1><p>Accès réservé aux enseignants autorisés</p></header><main id="app"><section class="panel">Chargement…</section></main></div><script>
const API='https://jipvubvkkmkblxqvzreg.supabase.co',KEY='sb_publishable_Q0fPK8f-qN-zb7Af4s-aJw_Cj28cyxa',TEACHER='leosimonusm82@gmail.com';let access=null,items=[],corrections={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hdr=()=>({'apikey':KEY,'Content-Type':'application/json',...(access?{'Authorization':'Bearer '+access}:{})});function loginView(msg=''){ $('app').innerHTML='<section class="panel"><h2>Connexion enseignant</h2><p>Utilise ton adresse autorisée et un mot de passe personnel (au moins 12 caractères). Ce mot de passe est différent du code local des évaluations.</p><form onsubmit="event.preventDefault();login()"><label>E-mail <input id="email" type="email" required autocomplete="username" value="'+TEACHER+'"></label><label>Mot de passe <input id="pass" type="password" required minlength="12" autocomplete="current-password"></label><div><button type="submit">Se connecter</button><button type="button" onclick="signup()">Créer mon accès enseignant</button></div></form><p id="message" role="status">'+esc(msg)+'</p><p class="muted">Lors de la première inscription, vérifie le message de confirmation envoyé par Supabase à ton adresse e-mail. Ne communique pas ton mot de passe aux élèves.</p></section>'}
async function signup(){const email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(email!==TEACHER){$('message').textContent='Adresse enseignant non autorisée.';return}if(password.length<12){$('message').textContent='Choisis au moins 12 caractères.';return}try{const r=await fetch(API+'/auth/v1/signup?redirect_to='+encodeURIComponent('https://epsconnect.github.io/EPSmultisport/resultats.html'),{method:'POST',headers:hdr(),body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Inscription impossible');$('message').textContent='Inscription demandée. Vérifie ton e-mail pour confirmer ton compte, puis reviens te connecter.'}catch(e){$('message').textContent=e.message}}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(email!==TEACHER){$('message').textContent='Adresse enseignant non autorisée.';return}try{const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:hdr(),body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error_description||j.msg||j.message||'Connexion impossible');access=j.access_token;await load()}catch(e){$('message').textContent=e.message}}
async function load(){try{const r=await fetch(API+'/rest/v1/eps_submissions?select=*&order=created_at.desc&limit=1000',{headers:hdr()});if(!r.ok)throw Error('Accès refusé ou session expirée ('+r.status+')');items=await r.json();await fetchCorrections();show()}catch(e){$('app').innerHTML='<section class="panel"><p class="danger">'+esc(e.message)+'</p><button onclick="logout()">Se reconnecter</button></section>'}}
function logout(){access=null;items=[];loginView('Déconnecté.')}
function show(){ $('app').innerHTML='<section class="panel"><h2>Fiches élèves · Compétences EPS</h2><p class="muted">'+students().length+' élève(s), '+items.length+' bilan(s). Propositions à valider par l’enseignant.</p><label>Classe <select id="filter" onchange="draw()"><option value="">Toutes</option>'+['6e1','6e2','5e1','5e2','4e1','4e2','3e1','3e2'].map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Rechercher <input id="search" placeholder="Nom, prénom, activité" oninput="draw()"></label><button onclick="load()">Actualiser</button><button onclick="exportCSV()">Exporter les compétences CSV</button><button onclick="logout()">Se déconnecter</button><div class="scroll" id="results"></div></section>';draw()}
function filtered(){const cls=$('filter')?.value||'',q=($('search')?.value||'').toLowerCase();return items.filter(x=>(!cls||x.class_name===cls)&&(!q||[x.student_last_name,x.student_first_name,x.activity,x.tool].join(' ').toLowerCase().includes(q)))}

const LEVEL=['À observer','Maîtrise insuffisante','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise'];
const COLORS=['#dfe5e8','#ef4444','#f97316','#3b82f6','#22c55e'];
function competency(x){const r=x.results||{},events=Array.isArray(r.events)?r.events:[],out=[];
const add=(domain,name,level,detail)=>out.push({domain,name,level,detail});
const pending=(domain,name,detail)=>add(domain,name,0,detail);
if(x.tool==='watch'){const laps=(Array.isArray(r.laps)?r.laps:[]).map(Number).filter(Number.isFinite),speed=Number(r.speed)||10;
if(laps.length>=3){const splits=laps.map((t,i)=>t-(laps[i-1]||0)),target=360000/speed,err=splits.reduce((a,t)=>a+Math.abs(t-target)/target,0)/splits.length;add('D1','Régularité de l’allure',err<=.05?4:err<=.10?3:err<=.20?2:1,'Écart moyen à la cible : '+Math.round(err*100)+' % (seuils indicatifs)')}else pending('D1','Régularité de l’allure','Au moins 3 passages nécessaires');
pending('D2','Observer et réguler son allure','Observation non mesurée par le chronomètre');pending('D4','Adapter son effort','À confirmer par observation')}
else if(x.tool==='contract'){pending('D1','Régularité de l’allure','Contrat théorique : aucun passage mesuré');pending('D2','Observer et réguler','À observer')}
else if(x.tool==='b31'){if(events.length>=6){const pts={g:3,b:2,o:1,r:0},score=events.slice(0,6).reduce((a,k)=>a+(pts[k]||0),0);add('D1','Efficacité du choix en attaque',score>=15?4:score>=11?3:score>=6?2:1,score+'/18 points sur 6 passages')}else pending('D1','Efficacité du choix en attaque','6 passages nécessaires')}
else if(x.tool==='bshoot'){if(events.length>=9){const n=events.filter(v=>v!=='m').length;add('D1','Réussite au tir',n>=8?4:n>=6?3:n>=3?2:1,n+'/9 tirs réussis')}else pending('D1','Réussite au tir','9 tirs nécessaires')}
else if(x.tool==='bobs'){if(events.length>=5){const n=events.filter(v=>v==='p'||v==='b').length,rate=n/events.length;add('D1','Efficacité avec ballon',rate>=.85?4:rate>=.65?3:rate>=.4?2:1,n+'/'+events.length+' actions positives')}else pending('D1','Efficacité avec ballon','5 actions nécessaires')}
else if(x.tool==='touch'){const hit=events.filter(v=>v==='h').length;if(events.length>=6)add('D1','Toucher sans être touché',hit/events.length>=.8?4:hit/events.length>=.65?3:hit/events.length>=.45?2:1,hit+'/'+events.length+' échanges positifs');else pending('D1','Toucher sans être touché','6 échanges nécessaires')}
else if(x.tool==='tour'){let rounds=[],n=0;for(const v of events){if(rounds.length===3)break;if(v==='h'){n++;if(n===4){rounds.push(4);n=0}}else{rounds.push(n);n=0}}if(rounds.length===3){const score=rounds.reduce((a,b)=>a+b,0);add('D1','Enchaîner les touches',score>=11?4:score>=8?3:score>=4?2:1,score+'/12 coins sur 3 tours')}else pending('D1','Enchaîner les touches','3 tours nécessaires')}
else if(x.tool==='voies'){const attempts=events.filter(v=>v&&typeof v==='object');if(attempts.length>=3){const ok=attempts.filter(v=>v.ok).length;add('D1','Réussir un itinéraire',ok/attempts.length>=.85?4:ok/attempts.length>=.65?3:ok/attempts.length>=.35?2:1,ok+'/'+attempts.length+' essais réussis ; cotations à contextualiser')}else pending('D1','Réussir un itinéraire','3 essais nécessaires')}
else if(x.tool==='tech'){const a=Object.values(r.ratings||{}).map(Number);if(a.length===4){const n=a.reduce((v,k)=>v+k,0)+4;add('D1','Fluidité et efficacité en escalade',n>=14?4:n>=10?3:n>=7?2:1,n+'/16 sur la grille technique')}else pending('D1','Fluidité et efficacité en escalade','4 critères nécessaires')}
else if(x.tool==='arb'){const a=Object.values(r.ratings||{}).map(Number);if(a.length===5){const n=a.reduce((v,k)=>v+k,0);add('D3','Arbitrer',n>=9?4:n>=7?3:n>=4?2:1,n+'/10 sur la grille')}else pending('D3','Arbitrer','5 critères nécessaires')}
else if(x.tool==='permis'){const a=Object.values(r.ratings||{});if(a.length===5){add('D3','Assurer en sécurité',a.every(v=>v===true)&&r.approved===true?4:a.every(v=>v===true)?3:1,r.approved===true?'Confirmation enseignant renseignée':'Validation enseignant encore nécessaire')}else pending('D3','Assurer en sécurité','5 critères et confirmation nécessaires')}
else pending('D1','Compétence spécifique','Barème à définir pour cet outil');
return out}
function assessment(x){return competency(x).map(c=>'<div style="padding:7px 0;border-bottom:1px solid #ddd"><b>'+esc(c.domain)+' — '+esc(c.name)+'</b><div><span style="display:inline-block;padding:5px 8px;border-radius:6px;background:'+COLORS[c.level]+';color:'+(c.level?'white':'#333')+'">'+LEVEL[c.level]+'</span></div><small>'+esc(c.detail)+'</small></div>').join('')+'<p class="muted">Proposition indicative : validation par l’enseignant requise.</p>'}

function studentKey(x){return x.class_name+'|'+x.student_last_name.trim().toLowerCase()+'|'+x.student_first_name.trim().toLowerCase()}
function students(){const map=new Map();for(const x of items){const k=studentKey(x);if(!map.has(k))map.set(k,{key:k,name:x.student_last_name+' '+x.student_first_name,cls:x.class_name,rows:[]});map.get(k).rows.push(x)}return [...map.values()].sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name,'fr'))}
async function fetchCorrections(){const r=await fetch(API+'/rest/v1/eps_assessment_overrides?select=submission_id,criterion_key,level&limit=5000',{headers:hdr()});if(!r.ok)throw Error('Corrections non accessibles');corrections={};for(const x of await r.json())corrections[x.submission_id+'|'+x.criterion_key]=x.level}
async function correctLevel(id,key,v){const level=Number(v);const r=await fetch(API+'/rest/v1/eps_assessment_overrides?on_conflict=submission_id,criterion_key',{method:'POST',headers:{...hdr(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({submission_id:id,criterion_key:key,level})});if(!r.ok){alert('Correction non enregistrée');return}corrections[id+'|'+key]=level;studentDetail(window.activeStudent)}
window.activeStudent='';
function levelBadge(v){return '<span style="display:inline-block;padding:6px 10px;border-radius:7px;background:'+COLORS[v]+';color:'+(v?'white':'#333')+';font-weight:700">'+LEVEL[v]+'</span>'}
function studentDetail(k){window.activeStudent=k;const st=students().find(x=>x.key===k);if(!st)return;let html='<section class="panel"><button onclick="show()">← Retour aux classes</button><h2>'+esc(st.name)+' · '+esc(st.cls)+'</h2><p>'+st.rows.length+' bilan(s) · Synthèse des compétences par activité</p>';for(const activity of [...new Set(st.rows.map(x=>x.activity))]){const rows=st.rows.filter(x=>x.activity===activity);html+='<h3>'+esc(({basket:'Basketball',course:'Course de durée',boxe:'Boxe française',esca:'Escalade'})[activity]||activity)+'</h3>';const map=new Map();for(const x of rows){for(const c of competency(x)){const k=c.domain+'|'+c.name;if(!map.has(k)||(!map.get(k).level&&c.level))map.set(k,{...c,created_at:x.created_at,submission_id:x.id,criterion_key:c.domain+'|'+c.name})}}for(const c of map.values())html+='<div style="border-bottom:1px solid #ddd;padding:12px"><b>'+esc(c.domain)+' · '+esc(c.name)+'</b><div style="margin:8px 0">'+levelBadge(corrections[c.submission_id+'|'+c.criterion_key]??c.level)+'</div><label>Corriger le niveau <select onchange="correctLevel(\''+c.submission_id+'\',\''+esc(c.criterion_key)+'\',this.value)">'+[0,1,2,3,4].map(v=>'<option value="'+v+'" '+((corrections[c.submission_id+'|'+c.criterion_key]??c.level)===v?'selected':'')+'>'+LEVEL[v]+'</option>').join('')+'</select></label><small>'+esc(c.detail)+' · '+esc(new Date(c.created_at).toLocaleDateString('fr-FR'))+'</small></div>'}html+='<h3>Historique détaillé</h3><div class="scroll"><table><tr><th>Date</th><th>Outil</th><th>Proposition</th><th>Données</th></tr>'+st.rows.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('fr-FR'))+'</td><td>'+esc(x.tool)+'</td><td>'+assessment(x)+'</td><td><details><summary>Voir</summary><pre>'+esc(JSON.stringify(x.results,null,2))+'</pre></details></td></tr>').join('')+'</table></div></section>';$('app').innerHTML=html}
function draw(){const cls=$('filter').value,q=$('search').value.toLowerCase();const a=students().filter(x=>(!cls||x.cls===cls)&&(!q||x.name.toLowerCase().includes(q)));$('results').innerHTML=a.length?'<table><tr><th>Classe</th><th>Élève</th><th>Bilans</th><th>Activités</th><th>Fiche</th></tr>'+a.map(x=>'<tr><td>'+esc(x.cls)+'</td><td>'+esc(x.name)+'</td><td>'+x.rows.length+'</td><td>'+esc([...new Set(x.rows.map(r=>r.activity))].join(', '))+'</td><td><button data-key="'+esc(x.key)+'" onclick="studentDetail(this.dataset.key)">Voir les compétences</button></td></tr>').join('')+'</table>':'<p>Aucun élève.</p>'}
function exportCSV(){const fields=['Date','Classe','Nom','Prénom','Activité','Outil','Domaine','Compétence','Niveau','Justification','Origine'],rows=[fields];for(const x of items){for(const c of competency(x)){const key=x.id+'|'+c.domain+'|'+c.name,manual=corrections[key];rows.push([new Date(x.created_at).toLocaleString('fr-FR'),x.class_name,x.student_last_name,x.student_first_name,x.activity,x.tool,c.domain,c.name,LEVEL[manual??c.level],c.detail,manual===undefined?'Proposition automatique':'Correction enseignant'])}}const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='eps-connect-competences.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
loginView();
</script></body></html>
